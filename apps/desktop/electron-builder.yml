appId: com.arava.crm
productName: ARAVA CRM
copyright: © 2026 ARAVA. Все права защищены.
asar: true
npmRebuild: false
asarUnpack:
  - node_modules/.prisma/client/**
  - node_modules/@prisma/client/**
directories:
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
  - from: .packaging/node_modules/.prisma/client
    to: node_modules/.prisma/client
    filter:
      - '**/*'
extraResources:
  - from: build/app-metadata.json
    to: app-metadata.json
  - from: build/icon.png
    to: icon.png
win:
  executableName: ARAVA CRM
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  verifyUpdateCodeSignature: false
linux:
  executableName: arava-crm
nsis:
  artifactName: ARAVA-CRM-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ARAVA CRM
  displayLanguageSelector: false
  installerLanguages:
    - ru_RU
