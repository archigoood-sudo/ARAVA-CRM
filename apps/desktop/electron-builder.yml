appId: com.arava.crm
productName: ARAVA CRM
copyright: © 2026 ARAVA. Все права защищены.
asar: true
npmRebuild: false
asarUnpack:
  - node_modules/.prisma/client/**
  - node_modules/@prisma/client/**
directories:
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
  - from: .packaging/node_modules/.prisma/client
    to: node_modules/.prisma/client
    filter:
      - '**/*'
extraResources:
  - from: build/app-metadata.json
    to: app-metadata.json
  - from: build/icon.png
    to: icon.png
publish:
  provider: github
  owner: archigoood-sudo
  repo: ARAVA-CRM
  channel: latest
  releaseType: release
mac:
  category: public.app-category.business
  hardenedRuntime: true
  notarize: true
  target:
    - dmg
    - zip
  artifactName: ARAVA-CRM-${version}-${arch}.${ext}
win:
  executableName: ARAVA CRM
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
linux:
  executableName: arava-crm
nsis:
  artifactName: ARAVA-CRM-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ARAVA CRM
  displayLanguageSelector: false
  installerLanguages:
    - ru_RU
