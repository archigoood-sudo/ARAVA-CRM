name: Desktop Development Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact Quality-approved main commit to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-development-release
  cancel-in-progress: false

jobs:
  prepare:
    outputs:
      commit: ${{ steps.verified.outputs.commit }}
      version: ${{ steps.version.outputs.value }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}
      - name: Verify exact current main commit
        id: verified
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          git fetch origin main
          head="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if [ "$head" != "$REQUESTED_COMMIT" ] || [ "$main" != "$REQUESTED_COMMIT" ]; then
            echo "Requested commit must exactly equal current origin/main" >&2
            exit 1
          fi
          echo "commit=$head" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require successful Quality run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_COMMIT: ${{ steps.verified.outputs.commit }}
        run: |
          count="$(gh api "repos/${{ github.repository }}/actions/workflows/quality.yml/runs?head_sha=$REQUESTED_COMMIT&status=success&event=push&per_page=1" --jq '.total_count')"
          if [ "$count" -lt 1 ]; then
            echo "No successful Quality push run exists for $REQUESTED_COMMIT" >&2
            exit 1
          fi
      - name: Compute monotonic development version
        id: version
        run: |
          current="$(node -p "require('./apps/desktop/package.json').version")"
          version="$(node scripts/compute-development-version.mjs "$current" "${{ github.run_number }}")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Development version: $version"

  publish-windows:
    needs: prepare
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      ARAVA_BUILD_COMMIT: ${{ needs.prepare.outputs.commit }}
      ARAVA_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      ARAVA_UPDATE_CHANNEL: dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - name: Build exact approved commit
        run: npm run build
      - name: Publish Windows development prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: npm run release:win:dev -w @arava/desktop
      - name: Verify development package metadata
        shell: pwsh
        run: |
          node scripts/verify-packaged-version.mjs '${{ needs.prepare.outputs.version }}' apps/desktop/release/win-unpacked/resources/app-metadata.json apps/desktop/release/win-unpacked/resources/app.asar
          $metadata = Get-Content apps/desktop/release/win-unpacked/resources/app-metadata.json | ConvertFrom-Json
          if ($metadata.updateChannel -ne 'dev') { throw 'Development update channel mismatch' }
          if (-not (Select-String -Path apps/desktop/release/dev.yml -Pattern '^version: ${{ needs.prepare.outputs.version }}$' -Quiet)) {
            throw 'dev.yml version mismatch'
          }
      - name: Record installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/release/ARAVA-CRM-*-x64.exe | Select-Object -First 1
          if (-not $installer) { throw 'Development installer was not produced' }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "Installer: $($installer.Name)" | Tee-Object -FilePath development-release.txt
          "SHA-256: $($hash.Hash.ToLowerInvariant())" | Tee-Object -FilePath development-release.txt -Append
          "Commit: ${{ needs.prepare.outputs.commit }}" | Tee-Object -FilePath development-release.txt -Append
      - uses: actions/upload-artifact@v4
        with:
          name: arava-crm-windows-development-${{ needs.prepare.outputs.commit }}
          path: |
            apps/desktop/release/ARAVA-CRM-*-x64.exe
            apps/desktop/release/ARAVA-CRM-*-x64.exe.blockmap
            apps/desktop/release/dev.yml
            development-release.txt
          if-no-files-found: error

  publish-macos:
    needs:
      - prepare
      - publish-windows
    permissions:
      contents: write
    runs-on: macos-15-intel
    env:
      ARAVA_BUILD_COMMIT: ${{ needs.prepare.outputs.commit }}
      ARAVA_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      ARAVA_UPDATE_CHANNEL: dev
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run package:mac:dev -w @arava/desktop
      - name: Verify macOS development package metadata
        run: |
          node scripts/verify-packaged-version.mjs '${{ needs.prepare.outputs.version }}' 'apps/desktop/release/mac-universal/ARAVA CRM.app/Contents/Resources/app-metadata.json' 'apps/desktop/release/mac-universal/ARAVA CRM.app/Contents/Resources/app.asar' 'apps/desktop/release/mac-universal/ARAVA CRM.app/Contents/Info.plist'
          grep -q '^version: ${{ needs.prepare.outputs.version }}$' apps/desktop/release/dev-mac.yml
      - name: Attach macOS development package to prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload 'v${{ needs.prepare.outputs.version }}' \
            'apps/desktop/release/ARAVA-CRM-${{ needs.prepare.outputs.version }}-universal.dmg' \
            'apps/desktop/release/ARAVA-CRM-${{ needs.prepare.outputs.version }}-universal.dmg.blockmap' \
            'apps/desktop/release/ARAVA-CRM-${{ needs.prepare.outputs.version }}-universal.zip' \
            'apps/desktop/release/ARAVA-CRM-${{ needs.prepare.outputs.version }}-universal.zip.blockmap' \
            apps/desktop/release/dev-mac.yml --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: arava-crm-macos-development-${{ needs.prepare.outputs.commit }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/dev-mac.yml
          if-no-files-found: error
