name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: xvfb-run --auto-servernum npm run test:e2e
      - run: xvfb-run --auto-servernum npm run test:e2e:packaged

  windows-installer:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - name: Select packaged Windows update channel
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $channel = node scripts/windows-update-channel.mjs $version
          "ARAVA_UPDATE_CHANNEL=$channel" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run build:win
      - name: Verify in-place upgrade preserves application data
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/release/ARAVA-CRM-*-x64.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced' }
          ./scripts/verify-windows-upgrade.ps1 -CurrentInstaller $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: arava-crm-windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  macos-package:
    runs-on: macos-15-intel
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: arava-crm-macos-package
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
