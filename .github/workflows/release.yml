name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - name: Verify tag matches application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-tag.mjs
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: xvfb-run --auto-servernum npm run test:e2e
      - run: xvfb-run --auto-servernum npm run test:e2e:packaged

  publish-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - name: Verify tag matches application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-tag.mjs
      - name: Select packaged Windows update channel
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $channel = node scripts/windows-update-channel.mjs $version
          "ARAVA_UPDATE_CHANNEL=$channel" >> $env:GITHUB_ENV
      - name: Build and publish Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win
      - name: Verify published Windows metadata
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $expectedChannel = node scripts/windows-update-channel.mjs $version
          $metadata = Get-Content apps/desktop/release/win-unpacked/resources/app-metadata.json | ConvertFrom-Json
          if ($metadata.appVersion -ne $version) { throw 'Packaged app version mismatch' }
          if ($metadata.updateChannel -ne $expectedChannel) { throw 'Packaged update channel mismatch' }
          if (-not (Select-String -Path apps/desktop/release/latest.yml -Pattern "^version: $version$" -Quiet)) {
            throw 'latest.yml version mismatch'
          }

  publish-macos:
    needs:
      - verify
      - publish-windows
    runs-on: macos-15-intel
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - name: Verify tag matches application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-tag.mjs
      - name: Build and publish universal macOS manual installer
        run: npm run release:mac
